name: Cursor App Network isolation proof (not native acceptance)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos-network-proof:
    name: macOS Network isolation proof (not native acceptance)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test network isolation proof
        run: node --test scripts/cursor-app-macos-isolation-check.test.mjs scripts/cursor-app-isolation-workflow.test.mjs
      - name: Run macOS network isolation proof (not native acceptance)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cursor-app-isolation"
          node scripts/cursor-app-macos-isolation-check.mjs > "$RUNNER_TEMP/cursor-app-isolation/report.json"
      - name: Upload public network isolation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-app-macos-network-isolation-proof
          path: ${{ runner.temp }}/cursor-app-isolation/report.json
          if-no-files-found: error
