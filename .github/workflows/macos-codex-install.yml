        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Record native test inputs
        id: record-inputs
        continue-on-error: true
        shell: bash
        env:
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.claude }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
          PACKAGE_ARTIFACT_NAME: ${{ needs.package.outputs.package-artifact-name }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.package-artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.package.outputs.package-artifact-digest }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package-sha256 }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs inputs "$RUNNER_TEMP/native-evidence/inputs.json" \
            --client claude --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" \
            --matrix-os "$MATRIX_OS" --matrix-node "$MATRIX_NODE" --npm-version "$(npm -v)" \
            --package-dir dist/npm/tarballs --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --expected-package-sha256 "$PACKAGE_SHA256"
      - name: Verify Claude lifecycle, interruption, native flows and Repo Memory configuration (macOS/Linux)
        id: native-posix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
        run: bash scripts/ci/claude/claude-install-check.sh dist/npm/tarballs "$CLAUDE_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/shared/codex-install-user-path.test.ps1
      - name: Verify Claude lifecycle, interruption, native flows and Repo Memory configuration (Windows)
        id: native-windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/ci/claude/claude-install-check.ps1 -TarballDirectory dist/npm/tarballs -ClaudeVersion $env:CLAUDE_VERSION
      - name: Summarize first-failure evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TEST_OUTCOME: ${{ runner.os == 'Windows' && steps.native-windows.outcome || steps.native-posix.outcome }}
          INPUTS_OUTCOME: ${{ steps.record-inputs.outcome }}
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.claude }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs summarize "$RUNNER_TEMP/native-evidence" --client claude --os "$MATRIX_OS" \
            --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" --node "$MATRIX_NODE" \
            --test-step-outcome "$TEST_OUTCOME" --inputs-step-outcome "$INPUTS_OUTCOME" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload-evidence
        if: always()
        continue-on-error: true
        with:
          name: native-evidence-claude-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report evidence export
        if: always()
        continue-on-error: true
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
          ARTIFACT_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
        run: node scripts/ci/shared/ci-evidence.mjs export-status --outcome "$UPLOAD_OUTCOME" --artifact-id "$ARTIFACT_ID" --github-summary "$GITHUB_STEP_SUMMARY"

  codebuddy:
    name: CodeBuddy functional ${{ matrix.channel }} ${{ matrix.codebuddy }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.codebuddy-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Verify CodeBuddy lifecycle, interruption, native flows and Repo Memory configuration (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODEBUDDY_VERSION: ${{ matrix.codebuddy }}
        run: bash scripts/ci/codebuddy-workbuddy/codebuddy-install-check.sh dist/npm/tarballs "$CODEBUDDY_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/shared/codex-install-user-path.test.ps1
      - name: Verify CodeBuddy lifecycle, interruption, native flows and Repo Memory configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEBUDDY_VERSION: ${{ matrix.codebuddy }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/ci/codebuddy-workbuddy/codebuddy-install-check.ps1 -TarballDirectory dist/npm/tarballs -CodeBuddyVersion $env:CODEBUDDY_VERSION

  cursor-app:
    name: Cursor App ${{ matrix.channel }} ${{ matrix.cursor }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.cursor-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.cursor-releases-artifact-name }}
          path: ${{ runner.temp }}/cursor-app-releases
      - name: Verify Windows installer wait and diagnostic contracts
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: node --test scripts/ci/cursor/cursor-app-windows-check.test.mjs scripts/ci/cursor/cursor-app-windows-installer-diagnostics.test.mjs
      - name: Verify Cursor package lifecycle and saved account
        shell: bash
        run: |
          set -- dist/npm/tarballs/memorax-memorax-code-preview-*.tgz
          [[ "$#" -eq 1 && -f "$1" && ! -L "$1" ]] || exit 1
          node scripts/ci/cursor/cursor-lifecycle-check.mjs "$1" "$RUNNER_TEMP/cursor-lifecycle-report"
      - name: Verify isolated native Cursor App writeback
        shell: bash
        env:
          CURSOR_RELEASE: ${{ matrix.release }}
          CURSOR_NODE: ${{ matrix.node }}
        run: |
          set -- dist/npm/tarballs/memorax-memorax-code-preview-*.tgz
          [[ "$#" -eq 1 && -f "$1" && ! -L "$1" ]] || exit 1
          case "$RUNNER_OS" in
            Linux) entrypoint=scripts/ci/cursor/cursor-app-container-check.mjs ;;
            macOS) entrypoint=scripts/ci/cursor/cursor-app-macos-check.mjs ;;
            Windows) entrypoint=scripts/ci/cursor/cursor-app-windows-check.mjs ;;
            *) echo 'Unsupported Cursor App runner.' >&2; exit 1 ;;
          esac
          node "$entrypoint" "$1" "$RUNNER_TEMP/cursor-app-report" \
            "$RUNNER_TEMP/cursor-app-releases/cursor-app-releases.json" "$CURSOR_RELEASE" "$CURSOR_NODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-lifecycle-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-report-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-lifecycle-report/report.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-app-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-report-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-app-report/report.json
          if-no-files-found: error
          retention-days: 30

  workbuddy-releases:
    name: WorkBuddy releases
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance' || inputs.mode == 'workbuddy-download-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      coverage: ${{ steps.releases.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the isolated release metadata parser
        shell: bash
        run: |
          deps="$RUNNER_TEMP/workbuddy-release-tools"
          mkdir -p "$deps/user" "$deps/tmp"
          env -i PATH="$PATH" HOME="$deps/user" TMPDIR="$deps/tmp" \
            npm_config_cache="$deps/npm-cache" npm install --prefix "$deps" \
            --no-save --package-lock=false --ignore-scripts --no-audit --no-fund yaml@2.9.1
          entry="$(node -p "require.resolve('yaml', { paths: [process.argv[1]] })" "$deps")"
          printf 'WORKBUDDY_YAML_MODULE=%s\n' "$entry" >> "$GITHUB_ENV"
      - name: Verify WorkBuddy and shared native test contracts
        run: node --test scripts/ci/codebuddy-workbuddy/codebuddy-*.test.mjs scripts/ci/codebuddy-workbuddy/workbuddy-*.test.mjs
      - name: Resolve each platform's latest release once
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/codebuddy-workbuddy/workbuddy-release-matrix.mjs resolve

  workbuddy-native:
    name: WorkBuddy native (${{ matrix.os }}, Node ${{ matrix.node }}, ${{ matrix.release.channel }}, ${{ matrix.release.desktopVersion }})
    needs: [package, workbuddy-releases]
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && needs.workbuddy-releases.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance' || inputs.mode == 'workbuddy-download-diagnostic')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.workbuddy-releases.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Verify platform-specific WorkBuddy test contracts
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --test scripts/ci/codebuddy-workbuddy/workbuddy-*.test.mjs
      - name: Validate the frozen release for this runner
        shell: bash
        env:
          RELEASE_JSON: ${{ toJSON(matrix.release) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateRelease } from './scripts/ci/codebuddy-workbuddy/workbuddy-release-matrix.mjs';
          const platforms = { linux: 'linux-x64-deb', darwin: 'darwin-arm64', win32: 'win32-x64-user' };
          assert.equal(process.arch, process.platform === 'darwin' ? 'arm64' : 'x64');
          const release = validateRelease(JSON.parse(process.env.RELEASE_JSON), platforms[process.platform]);
          writeFileSync(join(process.env.RUNNER_TEMP, 'workbuddy-release.json'), JSON.stringify(release));
          NODE
      - name: Acquire the selected official WorkBuddy image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/workbuddy-bundle"
          bash scripts/ci/codebuddy-workbuddy/workbuddy-macos-bundle-check.sh "$RUNNER_TEMP/workbuddy-bundle" arm64 \
            "$RUNNER_TEMP/workbuddy-release.json" > "$RUNNER_TEMP/workbuddy-bundle.json"
      - name: Open the verified archive and validate the official application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive_name="$(node -e 'const f = require(process.argv[1]).file; if (!["WorkBuddy.dmg", "WorkBuddy.zip"].includes(f)) process.exit(1); process.stdout.write(f);' "$RUNNER_TEMP/workbuddy-bundle.json")"
          image="$RUNNER_TEMP/workbuddy-bundle/$archive_name"
          mountpoint="$RUNNER_TEMP/workbuddy-bundle/mounted"
          if [[ "$archive_name" == WorkBuddy.dmg ]]; then
            spctl --assess --type open --context context:primary-signature "$image" \
              > "$RUNNER_TEMP/workbuddy-bundle/image-assessment.log" 2>&1
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$image" \
              > "$RUNNER_TEMP/workbuddy-bundle/mount.log" 2>&1
            echo 'WORKBUDDY_IMAGE_ATTACHED=true' >> "$GITHUB_ENV"
          else
            mkdir "$mountpoint"
            ditto -x -k "$image" "$mountpoint" > "$RUNNER_TEMP/workbuddy-bundle/extract.log" 2>&1
          fi
          app="$mountpoint/WorkBuddy.app"
          [[ -d "$app" && ! -L "$app" ]]
          codesign --verify --deep --strict --all-architectures \
            --test-requirement '=identifier "com.tencent.workbuddy.mac" and anchor apple generic and certificate leaf[subject.OU] = "FN2V63AD2J"' \
            "$app" > "$RUNNER_TEMP/workbuddy-bundle/signature.log" 2>&1
          spctl --assess --type execute "$app" \
            > "$RUNNER_TEMP/workbuddy-bundle/application-assessment.log" 2>&1
          product_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          node --input-type=module - "$app" "$product_version" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync, statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const release = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'workbuddy-release.json'), 'utf8'));
          assert.equal(process.argv[3], release.productVersion);
          const cli = join(process.argv[2], 'Contents/Resources/app.asar.unpacked/cli');
          for (const name of ['package.json', 'bin/codebuddy']) {
            const path = join(cli, name);
            assert.equal(realpathSync(path), path);
            assert.ok(statSync(path).isFile());
          }
          const metadata = JSON.parse(readFileSync(join(cli, 'package.json'), 'utf8'));
          assert.equal(metadata.publishConfig?.customPackage?.name, '@tencent-ai/codebuddy-code');
          assert.equal(metadata.bin?.codebuddy, './bin/codebuddy');
          const runtime = metadata.publishConfig?.customPackage?.version;
          assert.match(runtime, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.ok(!/[\r\n]/.test(runtime));
          if (release.runtimeVersion !== null) assert.equal(runtime, release.runtimeVersion);
          const reportPath = join(process.env.RUNNER_TEMP, 'workbuddy-bundle.json');
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          report.runtimeVersion = runtime;
          report.command = 'mounted/WorkBuddy.app/Contents/Resources/app.asar.unpacked/cli/bin/codebuddy';
          writeFileSync(reportPath, JSON.stringify(report));
          NODE
      - name: Acquire and extract the selected official Linux package
        if: runner.os == 'Linux'
        shell: bash
        env:
          WORKBUDDY_DOWNLOAD_DIAGNOSTIC_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'workbuddy-download-diagnostic' && format('{0}/workbuddy-download-diagnostic', runner.temp) || '' }}
        run: |
          mkdir "$RUNNER_TEMP/workbuddy-bundle"
          bash scripts/ci/codebuddy-workbuddy/workbuddy-linux-bundle-check.sh "$RUNNER_TEMP/workbuddy-bundle" x64 \
            "$RUNNER_TEMP/workbuddy-release.json" > "$RUNNER_TEMP/workbuddy-bundle.json"
      - name: Retain Linux download evidence for manual diagnosis
        if: always() && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.mode == 'workbuddy-download-diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-linux-download-node-${{ matrix.node }}-${{ matrix.release.channel }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workbuddy-download-diagnostic/WorkBuddy.deb
            ${{ runner.temp }}/workbuddy-download-diagnostic/download.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Acquire and extract the signed official Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'workbuddy-bundle'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $report = & ./scripts/ci/codebuddy-workbuddy/workbuddy-windows-bundle-check.ps1 -Destination $destination -ReleaseFile (Join-Path $env:RUNNER_TEMP 'workbuddy-release.json')
          if ($LASTEXITCODE -ne 0) { throw 'WorkBuddy package acquisition failed.' }
          $report | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'workbuddy-bundle.json') -Encoding utf8
      - name: Record the verified bundled runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import { isAbsolute, join, relative, resolve } from 'node:path';
          const root = realpathSync(join(process.env.RUNNER_TEMP, 'workbuddy-bundle'));
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'workbuddy-bundle.json'), 'utf8'));
          assert.match(report.runtimeVersion, /^\d+\.\d+\.\d+$/);
          assert.match(report.desktopVersion, /^\d+\.\d+\.\d+\.\d+$/);
          assert.equal(typeof report.command, 'string');
          assert.ok(!isAbsolute(report.command));
          const command = realpathSync(resolve(root, report.command));
          const local = relative(root, command);
          assert.ok(local && !isAbsolute(local) && local !== '..' && !local.startsWith('../') && !local.startsWith('..\\'));
          assert.ok(!/[\r\n]/.test(command));
          appendFileSync(process.env.GITHUB_ENV, `WORKBUDDY_BUNDLED_COMMAND=${command}\nWORKBUDDY_RUNTIME_VERSION=${report.runtimeVersion}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Official desktop **${report.desktopVersion}** / bundled CLI **${report.runtimeVersion}** (${report.arch}).\n\n`);
          NODE
      - name: Record the verified WorkBuddy versions for the release record
        shell: bash
        env:
          WORKBUDDY_OS: ${{ matrix.os }}
          WORKBUDDY_NODE: ${{ matrix.node }}
          WORKBUDDY_CHANNEL: ${{ matrix.release.channel }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const temp = process.env.RUNNER_TEMP;
          const bundle = JSON.parse(readFileSync(join(temp, 'workbuddy-bundle.json'), 'utf8'));
          const release = JSON.parse(readFileSync(join(temp, 'workbuddy-release.json'), 'utf8'));
          // Linux records the downloaded hash and only warns on a difference; macOS and Windows stop before use unless it matches.
          const actual = String(bundle.sha256).toLowerCase();
          mkdirSync(join(temp, 'workbuddy-report'), { recursive: true });
          writeFileSync(join(temp, 'workbuddy-report', 'report.json'), `${JSON.stringify({ schemaVersion: 2,
            runId: process.env.GITHUB_RUN_ID, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            os: process.env.WORKBUDDY_OS, node: process.env.WORKBUDDY_NODE, channel: process.env.WORKBUDDY_CHANNEL,
            desktopVersion: bundle.desktopVersion, runtimeVersion: bundle.runtimeVersion, arch: bundle.arch,
            source: new URL(release.url).host,
            sha256: { reference: release.sha256, actual, status: actual === release.sha256 ? 'match' : 'warning' } }, null, 2)}\n`);
          NODE
      - name: Run strict native WorkBuddy suites with isolated local services (macOS/Linux)
        id: native-posix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test_root="$RUNNER_TEMP/workbuddy-diagnostic"
          mkdir -p "$test_root/user" "$test_root/tmp"
          env -i PATH="$PATH" HOME="$test_root/user" \
            MEMORAX_CODE_HOME="$test_root/state" \
            npm_config_cache="$test_root/npm-cache" TMPDIR="$test_root/tmp" \
            node scripts/ci/codebuddy-workbuddy/workbuddy-e2e.mjs dist/npm/tarballs "$WORKBUDDY_BUNDLED_COMMAND" "$WORKBUDDY_RUNTIME_VERSION" 0.1.18
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/shared/codex-install-user-path.test.ps1
      - name: Run strict native WorkBuddy suites with isolated local services (Windows)
        id: native-windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          & node scripts/ci/codebuddy-workbuddy/workbuddy-e2e.mjs dist/npm/tarballs $env:WORKBUDDY_BUNDLED_COMMAND $env:WORKBUDDY_RUNTIME_VERSION 0.1.18
          if ($LASTEXITCODE -ne 0) { throw 'WorkBuddy native suites failed; isolated state retained.' }
      - name: Unmount the owned WorkBuddy image
        if: always() && runner.os == 'macOS' && env.WORKBUDDY_IMAGE_ATTACHED == 'true'
        shell: bash
        run: hdiutil detach "$RUNNER_TEMP/workbuddy-bundle/mounted"
      - name: Record the acceptance boundary
        if: always()
        env:
          NATIVE_OUTCOME: ${{ runner.os == 'Windows' && steps.native-windows.outcome || steps.native-posix.outcome }}
        shell: bash
        run: |
          printf 'WorkBuddy %s native checks: **%s**.\n\n' "$RUNNER_OS" "$NATIVE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Installation, setup interruption, Memory/Skill, four permission cases and Repo Memory worker configuration checks. The two explicit runtime interrupt cases are excluded and remain separate strict manual diagnostics. General runtime interruption, desktop UI and valid Repo Memory generation are not established. This result covers only the selected verified package and current runner; the entire platform, release and Node matrix must pass for an overall result.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbuddy-report-${{ matrix.os }}-${{ matrix.release.channel }}-node-${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbuddy-report/report.json
          if-no-files-found: warn
          retention-days: 30

  opencode-initialization-diagnostic:
    name: OpenCode Windows initialization diagnostic (not functional acceptance)
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'opencode-initialization-diagnostic' && needs.package.outputs.artifact-ready == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Compare initialization locations and path lengths with a warm offline cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node).Source
          $npm = (Get-Command npm.cmd).Source
          $tarballs = @(Get-ChildItem dist/npm/tarballs -Filter 'memorax-memorax-code-preview-*.tgz')
          if ($tarballs.Count -ne 1) { throw 'Expected one validated package.' }
          $osTempBase = [IO.Path]::GetTempPath()
          $runnerTempBase = $env:RUNNER_TEMP
          $root = Join-Path $env:RUNNER_TEMP ('opencode-init-diagnostic-' + [guid]::NewGuid())
          $prefix = Join-Path $root 'tools'
          New-Item -ItemType Directory -Force $root | Out-Null
          $allowed = @('PATH', 'SystemRoot', 'WINDIR', 'ComSpec', 'PATHEXT', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432')
          foreach ($item in @(Get-ChildItem Env:)) {
            if ($item.Name -notin $allowed) { [Environment]::SetEnvironmentVariable($item.Name, $null, 'Process') }
          }
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $env:HOME 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $env:HOME 'AppData/Local'
          $env:MEMORAX_CODE_HOME = Join-Path $root 'state'
          $env:CODEX_HOME = Join-Path $root 'codex'
          $env:CLAUDE_CONFIG_DIR = Join-Path $root 'claude'
          $env:OPENCODE_CONFIG_DIR = Join-Path $root 'opencode'
          $env:npm_config_cache = Join-Path $root 'npm-cache'
          $env:MEMORAX_CODE_TEST_NPM_CACHE = $env:npm_config_cache
          $env:TEMP = Join-Path $root 'tmp'
          $env:TMP = $env:TEMP
          $env:MEMORAX_CODE_AUTO_UPDATE = 'false'
          $env:MEMORAX_CODE_INSTALL_WATCHDOG = '0'
          New-Item -ItemType Directory -Force $env:HOME, $env:TEMP | Out-Null
          & $npm install --prefix $prefix --no-audit --no-fund opencode-ai@1.18.18 @vscode/ripgrep@1.18.0 $tarballs[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependency installation failed.' }
          $rg = & $node -e 'process.stdout.write(require(process.argv[1]).rgPath)' (Join-Path $prefix 'node_modules/@vscode/ripgrep')
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic ripgrep resolution failed.' }
          $env:PATH = "$(Split-Path $rg -Parent);$env:PATH"
          & $node scripts/ci/opencode/opencode-initialization-diagnostic.mjs (Join-Path $prefix 'node_modules/@memorax/memorax-code-preview') (Join-Path $prefix 'node_modules/opencode-ai/bin/opencode.exe') $osTempBase $runnerTempBase
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic reported a failure; inspect the recorded trials.' }
          Remove-Item -LiteralPath $root -Recurse -Force

  opencode-result:
    # Only pull request runs report the formal result names; push runs add (main push) and manual runs their mode.
    name: ${{ github.event_name == 'pull_request' && 'OpenCode functional result' || format('OpenCode functional result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    needs: [package, opencode]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire OpenCode matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          OPENCODE_RESULT: ${{ needs.opencode.result }}
        run: |
          printf 'Package: **%s**\n\nOpenCode matrix: **%s**\n' "$PACKAGE_RESULT" "$OPENCODE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$OPENCODE_RESULT" != success ]]; then
            echo '::error::All package and OpenCode matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  claude-result:
    name: ${{ github.event_name == 'pull_request' && 'Claude native smoke result' || format('Claude native smoke result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    needs: [package, claude]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire Claude native smoke matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
        run: |
          printf 'Package: **%s**\n\nClaude native smoke matrix: **%s**\n\nShared lifecycle, setup interruption, native memory, Skill, permission and Repo Memory global-configuration checks; client-specific coverage remains bounded.\n' "$PACKAGE_RESULT" "$CLAUDE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CLAUDE_RESULT" != success ]]; then
            echo '::error::All package and Claude native smoke matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  codebuddy-result:
    name: ${{ github.event_name == 'pull_request' && 'CodeBuddy functional result' || format('CodeBuddy functional result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    needs: [package, codebuddy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire CodeBuddy functional matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CODEBUDDY_RESULT: ${{ needs.codebuddy.result }}
        run: |
          printf 'Package: **%s**\n\nCodeBuddy functional matrix: **%s**\n\nShared lifecycle, setup interruption, native memory, Skill, permission and Repo Memory global-configuration checks; WorkBuddy is excluded and client-specific coverage remains bounded.\n' "$PACKAGE_RESULT" "$CODEBUDDY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CODEBUDDY_RESULT" != success ]]; then
            echo '::error::All package and CodeBuddy functional matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  cursor-app-result:
    name: ${{ github.event_name == 'pull_request' && 'Cursor App canary result' || format('Cursor App canary result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    needs: [package, cursor-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and Cursor App canary to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CURSOR_RESULT: ${{ needs.cursor-app.result }}
        run: |
          printf 'Package: **%s**\n\nCursor App Linux/macOS/Windows matrix: **%s**.\n\nUbuntu 24.04, macOS 15 and Windows 2025, baseline/latest on Node 24 and Linux baseline on Node 22. Eleven native App runs per cell cover repeated-prompt follow-up, cross-workspace isolation, App restart/resume, explicit Skill Search/Add, Shell denial, pending-Shell interruption and same-session recovery. A real foreground Hook also delegates a Repo Memory job through native Task: the managed child inherits model selection, claims the job and finishes without a bundle, requiring artifact_validation_failed, no published bundle, exited lease guard and no child automatic Add. Nine completed foreground turns produce exactly nine automatic Adds; the two explicit Skill operations bring the total Memory requests to eleven. Scripted tool requests do not validate model-driven Skill selection or successful Repo Memory generation. macOS and Windows use signature-verified Apps, isolated homes and local fixtures on fresh GitHub-hosted runners, without an additional Seatbelt or WFP prerequisite. Chromium sandboxing remains enabled. This matrix does not validate real login, OS credential-store isolation, hosted models or full functional coverage.\n' "$PACKAGE_RESULT" "$CURSOR_RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nEvery cell also requires the isolated MemoraX package lifecycle check: fresh/repeat setup, uninstall/reinstall, synthetic preview baseline upgrade, download and replacement failure recovery, saved account/configuration retention, and four setup interruption stages: after-config-write, before-backend-start, after-backend-start, saved-account-key-cancel. The setup checkpoints use a real PTY, the existing Backend lock and a test-only Node child gate; retries require no account input and verify complete Cursor integration plus a local saved-account Search. This does not simulate power loss or start the Cursor App.\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CURSOR_RESULT" != success ]]; then
            echo '::error::The package and Cursor App canary must both succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  workbuddy-result:
    # Only pull request runs report the formal result name; push runs add (main push) and manual runs their mode.
    name: ${{ github.event_name == 'pull_request' && 'WorkBuddy functional result' || format('WorkBuddy functional result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance' || inputs.mode == 'workbuddy-download-diagnostic')
    needs: [package, workbuddy-releases, workbuddy-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire WorkBuddy matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          RELEASES_RESULT: ${{ needs.workbuddy-releases.result }}
          WORKBUDDY_RESULT: ${{ needs.workbuddy-native.result }}
          WORKBUDDY_COVERAGE: ${{ needs.workbuddy-releases.outputs.coverage }}
        run: |
          printf 'Package: **%s**\n\nWorkBuddy releases: **%s**\n\nWorkBuddy matrix: **%s**\n\n%s\n\nThe two explicit runtime interrupt cases remain separate strict manual diagnostics.\n' "$PACKAGE_RESULT" "$RELEASES_RESULT" "$WORKBUDDY_RESULT" "${WORKBUDDY_COVERAGE:-Coverage unavailable.}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$RELEASES_RESULT" != success || "$WORKBUDDY_RESULT" != success ]]; then
            echo '::error::The package, release resolution and entire WorkBuddy matrix must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi
          if [[ -z "$WORKBUDDY_COVERAGE" ]]; then
            echo '::error::WorkBuddy release coverage is missing.'
            exit 1
          fi

  functional-result:
    name: ${{ github.event_name == 'pull_request' && 'Codex functional result' || github.event_name == 'workflow_dispatch' && inputs.mode == 'provider-only' && 'Codex provider-only result' || format('Codex functional result ({0})', github.event_name == 'push' && 'main push' || inputs.mode) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance' || inputs.mode == 'provider-only')
    needs: [package, install, provider]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job for the requested scope to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
          PROVIDER_RESULT: ${{ needs.provider.result }}
          PROVIDER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'provider-only' }}
        run: |
          if [[ "$PROVIDER_ONLY" == true ]]; then
            printf 'Provider-only check: **%s**. This run does not validate the functional matrix.\n' "$PROVIDER_RESULT" >> "$GITHUB_STEP_SUMMARY"
            [[ "$PROVIDER_RESULT" == success ]]
            exit
          fi
          printf 'Package: **%s**\n\nCodex matrix: **%s**\n' "$PACKAGE_RESULT" "$INSTALL_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$INSTALL_RESULT" != success ]]; then
            echo '::error::All package and Codex matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  provider:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'provider-only'
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned Codex CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/provider-user"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/provider-user" \
            npm install --global --prefix "$RUNNER_TEMP/provider-cli" \
            --no-audit --no-fund @openai/codex@0.147.0
      - name: Check native Codex with the configured provider
        shell: bash
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/ci/codex/codex-provider-smoke.mjs "$RUNNER_TEMP/provider-cli/bin/codex"

  candidate:
    name: Release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      record: ${{ steps.candidate.outputs.record }}
      docs-base-sha: ${{ steps.candidate.outputs.docs-base-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Eligibility problems are recorded, not raised, so they never prevent the planned acceptance jobs from running.
      - name: Record the candidate commit, version and release eligibility
        id: candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/ci/shared/release-acceptance.mjs candidate --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --expected-sha "$EXPECTED_SHA" --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

  basic-checks:
    name: Basic checks
    needs: candidate
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'release-acceptance'
    uses: ./.github/workflows/ci.yml
    with:
      purpose: release-acceptance
      candidate-sha: ${{ github.sha }}
      docs-base-sha: ${{ needs.candidate.outputs.docs-base-sha }}

  release-result:
    name: Release acceptance result
    needs: [candidate, basic-checks, package, workbuddy-releases, functional-result, opencode-result, claude-result, codebuddy-result, cursor-app-result, workbuddy-result]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'release-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Collection failures leave evidence missing; the decision step then reports the acceptance as incomplete.
      - uses: actions/download-artifact@v4
        if: needs.package.outputs.package-artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          path: ${{ runner.temp }}/release-candidate
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: workbuddy-report-*
          path: ${{ runner.temp }}/workbuddy-reports
      - name: Read the candidate artifact record and every attempt's jobs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.package-artifact-id }}
        run: |
          api="$RUNNER_TEMP/release-api"
          mkdir -p "$api"
          if [[ "$PACKAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]] \
            && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID" > "$api/artifact.partial"; then
            mv "$api/artifact.partial" "$api/artifact.json"
          else
            rm -f "$api/artifact.partial"
          fi
          # Each attempt is written only after every page was read; a failed query leaves a marker, never a listing.
          for (( attempt = 1; attempt <= GITHUB_RUN_ATTEMPT; attempt++ )); do
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
              > "$api/attempt-$attempt.partial"; then
              mv "$api/attempt-$attempt.partial" "$api/attempt-$attempt.json"
            else
              rm -f "$api/attempt-$attempt.partial"
              : > "$api/attempt-$attempt.failed"
            fi
          done
      - name: Decide the release acceptance and write its record
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/ci/shared/release-acceptance.mjs record --package-dir "$RUNNER_TEMP/release-candidate" \
            --workbuddy-reports "$RUNNER_TEMP/workbuddy-reports" --api-dir "$RUNNER_TEMP/release-api" \
            --output "$RUNNER_TEMP/release-record/release-record.json" --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-record-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-record/release-record.json
          if-no-files-found: error
          retention-days: 90
