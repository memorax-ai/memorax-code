name: Native client functional checks

on:
  workflow_dispatch:
    inputs:
      check_deepseek:
        description: Run only the native Codex provider check using the test environment
        type: boolean
        default: false
      diagnose_opencode_initialization:
        description: Run only the isolated Windows OpenCode initialization diagnostic
        type: boolean
        default: false
      check_cursor_macos_isolation:
        description: Run only the macOS network isolation proof without downloading or starting Cursor
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codex-install-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation && 'cursor-proof' || inputs.diagnose_opencode_initialization && 'diagnostic' || 'acceptance' }}
  cancel-in-progress: true

jobs:
  cursor-macos-network-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation
    uses: ./.github/workflows/cursor-app-isolation.yml

  package:
    if: (github.event_name != 'workflow_dispatch' || !inputs.check_deepseek || inputs.diagnose_opencode_initialization) && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INITIALIZATION_DIAGNOSTIC: ${{ inputs.diagnose_opencode_initialization }}
    outputs:
      codex-matrix: ${{ steps.codex-versions.outputs.matrix }}
      opencode-matrix: ${{ steps.opencode-versions.outputs.matrix }}
      claude-matrix: ${{ steps.claude-versions.outputs.matrix }}
      codebuddy-matrix: ${{ steps.codebuddy-versions.outputs.matrix }}
      cursor-matrix: ${{ steps.cursor-versions.outputs.matrix }}
      artifact-ready: ${{ steps.package-check.outputs.artifact-ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve the latest Codex version once for this run
        id: codex-versions
        shell: bash
        run: |
          npm view @openai/codex dist-tags.latest --json > "$RUNNER_TEMP/codex-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '0.147.0';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/codex-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable Codex version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', codex: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', codex: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', codex: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Codex baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            (process.env.INITIALIZATION_DIAGNOSTIC === 'true'
              ? 'Initialization diagnostic only; this matrix will not run.\n'
              : `${include.length} required installation, native-flow and permission jobs; no version fallback.\n`));
          NODE
      - name: Resolve the latest OpenCode version once for this run
        id: opencode-versions
        shell: bash
        run: |
          npm view opencode-ai dist-tags.latest --json > "$RUNNER_TEMP/opencode-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '1.18.18';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/opencode-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable OpenCode version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', opencode: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', opencode: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', opencode: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `OpenCode baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            (process.env.INITIALIZATION_DIAGNOSTIC === 'true'
              ? 'Initialization diagnostic only; this matrix will not run.\n'
              : `${include.length} required installation, native-flow and permission jobs; no version fallback.\n`));
          NODE
      - name: Resolve the latest Claude Code version once for this run
        if: ${{ !inputs.diagnose_opencode_initialization }}
        id: claude-versions
        shell: bash
        run: |
          npm view @anthropic-ai/claude-code dist-tags.latest --json > "$RUNNER_TEMP/claude-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '2.1.277';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/claude-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable Claude Code version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', claude: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '22', claude: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', claude: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Claude Code baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required lifecycle, interruption, native memory, Skill, permission and Repo Memory configuration jobs; no version fallback. Client-specific coverage remains bounded.\n`);
          NODE
      - name: Resolve the latest CodeBuddy Code version once for this run
        if: ${{ !inputs.diagnose_opencode_initialization }}
        id: codebuddy-versions
        shell: bash
        run: |
          npm view @tencent-ai/codebuddy-code dist-tags.latest --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/codebuddy-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '2.159.0';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/codebuddy-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable CodeBuddy Code version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', codebuddy: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', codebuddy: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', codebuddy: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `CodeBuddy Code baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required lifecycle, interruption, native memory, Skill, permission and Repo Memory configuration jobs; no version fallback. WorkBuddy is outside this scope; client-specific coverage remains bounded.\n`);
          NODE
      - name: Resolve and freeze Cursor App releases once for this run
        if: github.event_name != 'workflow_dispatch' || !(inputs.check_deepseek || inputs.diagnose_opencode_initialization)
        id: cursor-versions
        shell: bash
        run: |
          node scripts/cursor-app-release.mjs resolve-linux "$RUNNER_TEMP/cursor-app-releases.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { validateLinuxRelease } from './scripts/cursor-app-release.mjs';
          import { selectCursorMacosRelease } from './scripts/cursor-app-macos-artifact.mjs';
          const manifest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cursor-app-releases.json`, 'utf8'));
          if (manifest.schemaVersion !== 1) throw new Error('Invalid frozen Cursor release inventory');
          const baseline = validateLinuxRelease(manifest.baseline['linux-x64'], 'linux-x64');
          const latest = validateLinuxRelease(manifest.latest['linux-x64'], 'linux-x64');
          const same = ['version', 'commitSha', 'url', 'sha256', 'debVersion'].every((key) => baseline[key] === latest[key]);
          const include = [
            { os: 'ubuntu-24.04', node: '24', cursor: baseline.version, release: 'baseline', channel: same ? 'baseline+latest' : 'baseline' },
            { os: 'ubuntu-24.04', node: '22', cursor: baseline.version, release: 'baseline', channel: 'baseline' },
          ];
          if (!same) include.push({ os: 'ubuntu-24.04', node: '24', cursor: latest.version, release: 'latest', channel: 'latest' });
          const macosBaseline = selectCursorMacosRelease(manifest, 'baseline');
          const macosLatest = selectCursorMacosRelease(manifest, 'latest');
          const sameMacos = ['version', 'commitSha', 'url'].every((key) => macosBaseline[key] === macosLatest[key]);
          include.push({ os: 'macos-15', node: '24', cursor: macosBaseline.version, release: 'baseline', channel: sameMacos ? 'baseline+latest' : 'baseline' });
          if (!sameMacos) include.push({ os: 'macos-15', node: '24', cursor: macosLatest.version, release: 'latest', channel: 'latest' });
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Cursor App baseline: **${baseline.version}**; desktop latest frozen for this run: **${latest.version}**.\n\n` +
            `${include.length} required Linux and macOS App jobs, including Linux baseline on Node 22. Windows remains outside this matrix. No version fallback.\n`);
          NODE
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || !(inputs.check_deepseek || inputs.diagnose_opencode_initialization)
        with:
          name: cursor-app-releases
          path: ${{ runner.temp }}/cursor-app-releases.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify test assertions reject malformed content and unexpected failures
        run: node --test scripts/native-process-cleanup.test.mjs scripts/codex-native-content-check.test.mjs scripts/codex-lifecycle-assertions.test.mjs scripts/codex-writeback-diagnostics.test.mjs scripts/opencode-native-support.test.mjs scripts/opencode-initialization-diagnostic.test.mjs scripts/opencode-initialization-layouts.test.mjs scripts/claude-native-content-check.test.mjs scripts/claude-native-support.test.mjs scripts/claude-permissions-support.test.mjs scripts/claude-lifecycle-assertions.test.mjs scripts/claude-lifecycle-process.test.mjs scripts/claude-background-assertions.test.mjs scripts/claude-install-interruption-driver.test.mjs scripts/codebuddy-native-content-check.test.mjs scripts/codebuddy-native-support.test.mjs scripts/codebuddy-install-cleanup.test.mjs scripts/codebuddy-lifecycle-assertions.test.mjs scripts/codebuddy-install-interruption-driver.test.mjs scripts/codebuddy-permissions-support.test.mjs scripts/codebuddy-background-assertions.test.mjs
      - name: Verify shared CodeBuddy and WorkBuddy native and install contracts
        run: node --test scripts/codebuddy-native-memory-support.test.mjs scripts/codebuddy-install-interruption-check.test.mjs scripts/workbuddy-install-entry.test.mjs
      - name: Verify Cursor App canary contracts
        run: node --test scripts/cursor-app-*.test.mjs
      - name: Build and validate the installable package
        id: package-check
        shell: bash
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/user" "$test_root/tmp"
          package_status=0
          env -i PATH="$PATH" HOME="$test_root/user" \
            MEMORAX_CODE_HOME="$test_root/state" \
            npm_config_cache="$test_root/npm-cache" TMPDIR="$test_root/tmp" \
            make npm-package-check || package_status=$?
          if [[ -f dist/npm/check-result.json ]]; then
            node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('dist/npm/check-result.json', 'utf8'));
          if (result.artifactChecks !== 'PASS') throw new Error('Artifact validation did not complete');
          appendFileSync(process.env.GITHUB_OUTPUT, 'artifact-ready=true\n');
          NODE
          fi
          exit "$package_status"
      - name: Record artifact checksum
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        shell: bash
        run: sha256sum dist/npm/tarballs/*.tgz
      - uses: actions/upload-artifact@v4
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        with:
          name: memorax-code-package
          path: dist/npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  install:
    name: Codex ${{ matrix.channel }} ${{ matrix.codex }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && !inputs.diagnose_opencode_initialization && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.codex-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Verify lifecycle, native writeback, permissions and shared configuration (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: scripts/codex-install-check.sh dist/npm/tarballs "$CODEX_VERSION"
      - name: Verify Windows user PATH cleanup on success, failure and interruption
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/codex-install-user-path.test.ps1
      - name: Verify lifecycle, native writeback, permissions and shared configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: ./scripts/codex-install-check.ps1 -TarballDirectory dist/npm/tarballs -CodexVersion $env:CODEX_VERSION

  opencode:
    name: OpenCode ${{ matrix.channel }} ${{ matrix.opencode }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && !inputs.diagnose_opencode_initialization && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.opencode-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Verify lifecycle, native memory, permissions and recovery (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
        run: bash scripts/opencode-install-check.sh dist/npm/tarballs "$OPENCODE_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/codex-install-user-path.test.ps1
      - name: Verify lifecycle, native memory, permissions and recovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/opencode-install-check.ps1 -TarballDirectory dist/npm/tarballs -OpenCodeVersion $env:OPENCODE_VERSION

  claude:
    name: Claude smoke ${{ matrix.channel }} ${{ matrix.claude }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && !inputs.diagnose_opencode_initialization && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.claude-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Verify Claude lifecycle, interruption, native flows and Repo Memory configuration (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
        run: bash scripts/claude-install-check.sh dist/npm/tarballs "$CLAUDE_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/codex-install-user-path.test.ps1
      - name: Verify Claude lifecycle, interruption, native flows and Repo Memory configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/claude-install-check.ps1 -TarballDirectory dist/npm/tarballs -ClaudeVersion $env:CLAUDE_VERSION

  codebuddy:
    name: CodeBuddy functional ${{ matrix.channel }} ${{ matrix.codebuddy }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && !inputs.diagnose_opencode_initialization && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.codebuddy-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Verify CodeBuddy lifecycle, interruption, native flows and Repo Memory configuration (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODEBUDDY_VERSION: ${{ matrix.codebuddy }}
        run: bash scripts/codebuddy-install-check.sh dist/npm/tarballs "$CODEBUDDY_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/codex-install-user-path.test.ps1
      - name: Verify CodeBuddy lifecycle, interruption, native flows and Repo Memory configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEBUDDY_VERSION: ${{ matrix.codebuddy }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/codebuddy-install-check.ps1 -TarballDirectory dist/npm/tarballs -CodeBuddyVersion $env:CODEBUDDY_VERSION

  cursor-app:
    name: Cursor App ${{ matrix.channel }} ${{ matrix.cursor }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.check_deepseek || inputs.diagnose_opencode_initialization || inputs.check_cursor_macos_isolation))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.cursor-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - uses: actions/download-artifact@v4
        with:
          name: cursor-app-releases
          path: ${{ runner.temp }}/cursor-app-releases
      - name: Verify isolated native Cursor App writeback
        shell: bash
        env:
          CURSOR_RELEASE: ${{ matrix.release }}
          CURSOR_NODE: ${{ matrix.node }}
        run: |
          set -- dist/npm/tarballs/memorax-memorax-code-*.tgz
          [[ "$#" -eq 1 && -f "$1" && ! -L "$1" ]] || exit 1
          case "$RUNNER_OS" in
            Linux) entrypoint=scripts/cursor-app-container-check.mjs ;;
            macOS) entrypoint=scripts/cursor-app-macos-check.mjs ;;
            *) echo 'Unsupported Cursor App runner.' >&2; exit 1 ;;
          esac
          node "$entrypoint" "$1" "$RUNNER_TEMP/cursor-app-report" \
            "$RUNNER_TEMP/cursor-app-releases/cursor-app-releases.json" "$CURSOR_RELEASE" "$CURSOR_NODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-app-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-report
          path: ${{ runner.temp }}/cursor-app-report/report.json
          if-no-files-found: error
          retention-days: 7

  opencode-initialization-diagnostic:
    name: OpenCode Windows initialization diagnostic (not functional acceptance)
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_opencode_initialization && !inputs.check_cursor_macos_isolation && needs.package.outputs.artifact-ready == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Compare initialization locations and path lengths with a warm offline cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node).Source
          $npm = (Get-Command npm.cmd).Source
          $tarballs = @(Get-ChildItem dist/npm/tarballs -Filter 'memorax-memorax-code-*.tgz')
          if ($tarballs.Count -ne 1) { throw 'Expected one validated package.' }
          $osTempBase = [IO.Path]::GetTempPath()
          $runnerTempBase = $env:RUNNER_TEMP
          $root = Join-Path $env:RUNNER_TEMP ('opencode-init-diagnostic-' + [guid]::NewGuid())
          $prefix = Join-Path $root 'tools'
          New-Item -ItemType Directory -Force $root | Out-Null
          $allowed = @('PATH', 'SystemRoot', 'WINDIR', 'ComSpec', 'PATHEXT', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432')
          foreach ($item in @(Get-ChildItem Env:)) {
            if ($item.Name -notin $allowed) { [Environment]::SetEnvironmentVariable($item.Name, $null, 'Process') }
          }
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $env:HOME 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $env:HOME 'AppData/Local'
          $env:MEMORAX_CODE_HOME = Join-Path $root 'state'
          $env:CODEX_HOME = Join-Path $root 'codex'
          $env:CLAUDE_CONFIG_DIR = Join-Path $root 'claude'
          $env:OPENCODE_CONFIG_DIR = Join-Path $root 'opencode'
          $env:npm_config_cache = Join-Path $root 'npm-cache'
          $env:MEMORAX_CODE_TEST_NPM_CACHE = $env:npm_config_cache
          $env:TEMP = Join-Path $root 'tmp'
          $env:TMP = $env:TEMP
          $env:MEMORAX_CODE_AUTO_UPDATE = 'false'
          $env:MEMORAX_CODE_INSTALL_WATCHDOG = '0'
          New-Item -ItemType Directory -Force $env:HOME, $env:TEMP | Out-Null
          & $npm install --prefix $prefix --no-audit --no-fund opencode-ai@1.18.18 @vscode/ripgrep@1.18.0 $tarballs[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependency installation failed.' }
          $rg = & $node -e 'process.stdout.write(require(process.argv[1]).rgPath)' (Join-Path $prefix 'node_modules/@vscode/ripgrep')
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic ripgrep resolution failed.' }
          $env:PATH = "$(Split-Path $rg -Parent);$env:PATH"
          & $node scripts/opencode-initialization-diagnostic.mjs (Join-Path $prefix 'node_modules/@memorax/memorax-code') (Join-Path $prefix 'node_modules/opencode-ai/bin/opencode.exe') $osTempBase $runnerTempBase
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic reported a failure; inspect the recorded trials.' }
          Remove-Item -LiteralPath $root -Recurse -Force

  opencode-result:
    name: OpenCode functional result
    if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.check_deepseek || inputs.diagnose_opencode_initialization || inputs.check_cursor_macos_isolation))
    needs: [package, opencode]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire OpenCode matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          OPENCODE_RESULT: ${{ needs.opencode.result }}
        run: |
          printf 'Package: **%s**\n\nOpenCode matrix: **%s**\n' "$PACKAGE_RESULT" "$OPENCODE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$OPENCODE_RESULT" != success ]]; then
            echo '::error::All package and OpenCode matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  claude-result:
    name: Claude native smoke result
    if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.check_deepseek || inputs.diagnose_opencode_initialization || inputs.check_cursor_macos_isolation))
    needs: [package, claude]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire Claude native smoke matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
        run: |
          printf 'Package: **%s**\n\nClaude native smoke matrix: **%s**\n\nShared lifecycle, setup interruption, native memory, Skill, permission and Repo Memory global-configuration checks; client-specific coverage remains bounded.\n' "$PACKAGE_RESULT" "$CLAUDE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CLAUDE_RESULT" != success ]]; then
            echo '::error::All package and Claude native smoke matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  codebuddy-result:
    name: CodeBuddy functional result
    if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.check_deepseek || inputs.diagnose_opencode_initialization || inputs.check_cursor_macos_isolation))
    needs: [package, codebuddy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and entire CodeBuddy functional matrix to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CODEBUDDY_RESULT: ${{ needs.codebuddy.result }}
        run: |
          printf 'Package: **%s**\n\nCodeBuddy functional matrix: **%s**\n\nShared lifecycle, setup interruption, native memory, Skill, permission and Repo Memory global-configuration checks; WorkBuddy is excluded and client-specific coverage remains bounded.\n' "$PACKAGE_RESULT" "$CODEBUDDY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CODEBUDDY_RESULT" != success ]]; then
            echo '::error::All package and CodeBuddy functional matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  cursor-app-result:
    name: Cursor App canary result
    if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.check_deepseek || inputs.diagnose_opencode_initialization || inputs.check_cursor_macos_isolation))
    needs: [package, cursor-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the package and Cursor App canary to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CURSOR_RESULT: ${{ needs.cursor-app.result }}
        run: |
          printf 'Package: **%s**\n\nCursor App Linux/macOS matrix: **%s**.\n\nUbuntu 24.04 and macOS 15, baseline/latest on Node 24 and Linux baseline on Node 22. Six completed App runs per cell exercise repeated-prompt follow-up, independent sessions, App restart/resume and explicit Skill Search/Add through native Read/Shell tools, using a local protocol mock, native database persistence and exact automatic Add with synthetic authentication. A seventh run cancels a pending Shell through native Stop, requiring interrupted Hook state, no command execution and no additional Memory request. Scripted tool requests do not validate model-driven Skill selection. macOS requires verified code signatures, Gatekeeper and a network-only sandbox on a fresh GitHub-hosted runner. This matrix does not validate real login, Keychain isolation, hosted models, full functional coverage or Windows acceptance.\n' "$PACKAGE_RESULT" "$CURSOR_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$CURSOR_RESULT" != success ]]; then
            echo '::error::The package and Cursor App canary must both succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  functional-result:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.check_deepseek && 'Codex provider-only result' || 'Codex functional result' }}
    if: always() && !inputs.diagnose_opencode_initialization && !(github.event_name == 'workflow_dispatch' && inputs.check_cursor_macos_isolation)
    needs: [package, install, provider]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job for the requested scope to succeed
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
          PROVIDER_RESULT: ${{ needs.provider.result }}
          PROVIDER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_deepseek }}
        run: |
          if [[ "$PROVIDER_ONLY" == true ]]; then
            printf 'Provider-only check: **%s**. This run does not validate the functional matrix.\n' "$PROVIDER_RESULT" >> "$GITHUB_STEP_SUMMARY"
            [[ "$PROVIDER_RESULT" == success ]]
            exit
          fi
          printf 'Package: **%s**\n\nCodex matrix: **%s**\n' "$PACKAGE_RESULT" "$INSTALL_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != success || "$INSTALL_RESULT" != success ]]; then
            echo '::error::All package and Codex matrix jobs must succeed. Failed, cancelled or skipped dependencies do not pass this check.'
            exit 1
          fi

  provider:
    if: github.event_name == 'workflow_dispatch' && inputs.check_deepseek && !inputs.diagnose_opencode_initialization && !inputs.check_cursor_macos_isolation
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned Codex CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/provider-user"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/provider-user" \
            npm install --global --prefix "$RUNNER_TEMP/provider-cli" \
            --no-audit --no-fund @openai/codex@0.147.0
      - name: Check native Codex with the configured provider
        shell: bash
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/codex-provider-smoke.mjs "$RUNNER_TEMP/provider-cli/bin/codex"
