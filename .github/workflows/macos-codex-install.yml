name: Codex functional checks

on:
  workflow_dispatch:
    inputs:
      check_deepseek:
        description: Run only the native Codex provider check using the test environment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codex-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_deepseek
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and validate the installable package
        shell: bash
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/user" "$test_root/tmp"
          env -i PATH="$PATH" HOME="$test_root/user" \
            MEMORAX_CODE_HOME="$test_root/state" \
            npm_config_cache="$test_root/npm-cache" TMPDIR="$test_root/tmp" \
            make npm-package-check
      - name: Record artifact checksum
        shell: bash
        run: sha256sum dist/npm/tarballs/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  install:
    name: Codex (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '24'
          - os: ubuntu-24.04
            node: '20'
          - os: macos-15
            node: '24'
          - os: windows-2025
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: memorax-code-package
          path: dist/npm/tarballs
      - name: Verify lifecycle, native writeback and permissions (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/codex-install-check.sh dist/npm/tarballs 0.147.0
      - name: Verify lifecycle, native writeback and permissions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/codex-install-check.ps1 -TarballDirectory dist/npm/tarballs -CodexVersion 0.147.0

  provider:
    if: github.event_name == 'workflow_dispatch' && inputs.check_deepseek
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned Codex CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/provider-user"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/provider-user" \
            npm install --global --prefix "$RUNNER_TEMP/provider-cli" \
            --no-audit --no-fund @openai/codex@0.147.0
      - name: Check native Codex with the configured provider
        shell: bash
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/codex-provider-smoke.mjs "$RUNNER_TEMP/provider-cli/bin/codex"
