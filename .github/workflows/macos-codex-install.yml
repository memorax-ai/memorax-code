name: Native client functional checks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: release-acceptance runs the complete acceptance for the dispatched commit and records its release eligibility; the other modes are isolated diagnostics
        type: choice
        default: release-acceptance
        options:
          - release-acceptance
          - provider-only
          - opencode-initialization-diagnostic
          - workbuddy-download-diagnostic
      expected_sha:
        description: Optional full commit SHA the release candidate must equal
        type: string
        default: ''
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run cancels only an older run of the same purpose: one pull request, main pushes, or one diagnostic mode on one ref.
  # Each release acceptance has its own group and is never cancelled by another run.
  group: codex-install-${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release-acceptance' && format('release-{0}', github.run_id) || format('{0}-{1}', github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.mode) || github.event_name, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'release-acceptance') }}

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'provider-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      codex-matrix: ${{ steps.codex-versions.outputs.matrix }}
      opencode-matrix: ${{ steps.opencode-versions.outputs.matrix }}
      claude-matrix: ${{ steps.claude-versions.outputs.matrix }}
      codebuddy-matrix: ${{ steps.codebuddy-versions.outputs.matrix }}
      cursor-matrix: ${{ steps.cursor-versions.outputs.matrix }}
      artifact-ready: ${{ steps.package-check.outputs.artifact-ready }}
      # Attempt-qualified names keep an earlier attempt's inputs when a later attempt re-runs this job.
      package-artifact-name: memorax-code-package-attempt${{ github.run_attempt }}
      package-artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      package-artifact-digest: ${{ steps.upload-package.outputs.artifact-digest }}
      package-sha256: ${{ steps.package-provenance.outputs.sha256 }}
      cursor-releases-artifact-name: cursor-app-releases-attempt${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Client versions are resolved only for runs whose client matrices consume them.
      - name: Resolve the latest Codex version once for this run
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        id: codex-versions
        shell: bash
        run: |
          npm view @openai/codex dist-tags.latest --json > "$RUNNER_TEMP/codex-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '0.147.0';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/codex-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable Codex version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', codex: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', codex: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', codex: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Codex baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required installation, native-flow and permission jobs; no version fallback.\n`);
          NODE
      - name: Resolve the latest OpenCode version once for this run
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        id: opencode-versions
        shell: bash
        run: |
          npm view opencode-ai dist-tags.latest --json > "$RUNNER_TEMP/opencode-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '1.18.18';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/opencode-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable OpenCode version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', opencode: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', opencode: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', opencode: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `OpenCode baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required installation, native-flow and permission jobs; no version fallback.\n`);
          NODE
      - name: Resolve the latest Claude Code version once for this run
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        id: claude-versions
        shell: bash
        run: |
          npm view @anthropic-ai/claude-code dist-tags.latest --json > "$RUNNER_TEMP/claude-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '2.1.277';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/claude-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable Claude Code version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', claude: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '22', claude: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', claude: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Claude Code baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required lifecycle, interruption, native memory, Skill, permission and Repo Memory configuration jobs; no version fallback. Client-specific coverage remains bounded.\n`);
          NODE
      - name: Resolve the latest CodeBuddy Code version once for this run
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        id: codebuddy-versions
        shell: bash
        run: |
          npm view @tencent-ai/codebuddy-code dist-tags.latest --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/codebuddy-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const baseline = '2.159.0';
          const latest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/codebuddy-latest.json`, 'utf8'));
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('The npm latest tag must resolve to an exact stable CodeBuddy Code version');
          }
          const platforms = ['ubuntu-24.04', 'macos-15', 'windows-2025'];
          const include = platforms.map((os) => ({ os, node: '24', codebuddy: baseline,
            channel: latest === baseline ? 'baseline+latest' : 'baseline' }));
          include.push({ os: 'ubuntu-24.04', node: '20', codebuddy: baseline, channel: 'baseline' });
          if (latest !== baseline) include.push(...platforms.map((os) => ({ os, node: '24', codebuddy: latest, channel: 'latest' })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `CodeBuddy Code baseline: **${baseline}**; npm latest resolved for this run: **${latest}**.\n\n` +
            `${include.length} required lifecycle, interruption, native memory, Skill, permission and Repo Memory configuration jobs; no version fallback. WorkBuddy is outside this scope; client-specific coverage remains bounded.\n`);
          NODE
      - name: Resolve and freeze Cursor App releases once for this run
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        id: cursor-versions
        shell: bash
        run: |
          node scripts/ci/cursor/cursor-app-release.mjs resolve-linux "$RUNNER_TEMP/cursor-app-releases.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { validateLinuxRelease } from './scripts/ci/cursor/cursor-app-release.mjs';
          import { selectCursorMacosRelease } from './scripts/ci/cursor/cursor-app-macos-artifact.mjs';
          import { selectCursorWindowsRelease } from './scripts/ci/cursor/cursor-app-windows-artifact.mjs';
          const manifest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cursor-app-releases.json`, 'utf8'));
          if (manifest.schemaVersion !== 1) throw new Error('Invalid frozen Cursor release inventory');
          const baseline = validateLinuxRelease(manifest.baseline['linux-x64'], 'linux-x64');
          const latest = validateLinuxRelease(manifest.latest['linux-x64'], 'linux-x64');
          const same = ['version', 'commitSha', 'url', 'sha256', 'debVersion'].every((key) => baseline[key] === latest[key]);
          const include = [
            { os: 'ubuntu-24.04', node: '24', cursor: baseline.version, release: 'baseline', channel: same ? 'baseline+latest' : 'baseline' },
            { os: 'ubuntu-24.04', node: '22', cursor: baseline.version, release: 'baseline', channel: 'baseline' },
          ];
          if (!same) include.push({ os: 'ubuntu-24.04', node: '24', cursor: latest.version, release: 'latest', channel: 'latest' });
          const macosBaseline = selectCursorMacosRelease(manifest, 'baseline');
          const macosLatest = selectCursorMacosRelease(manifest, 'latest');
          const sameMacos = ['version', 'commitSha', 'url'].every((key) => macosBaseline[key] === macosLatest[key]);
          include.push({ os: 'macos-15', node: '24', cursor: macosBaseline.version, release: 'baseline', channel: sameMacos ? 'baseline+latest' : 'baseline' });
          if (!sameMacos) include.push({ os: 'macos-15', node: '24', cursor: macosLatest.version, release: 'latest', channel: 'latest' });
          const windowsBaseline = selectCursorWindowsRelease(manifest, 'baseline');
          const windowsLatest = selectCursorWindowsRelease(manifest, 'latest');
          const sameWindows = ['version', 'commitSha', 'url'].every((key) => windowsBaseline[key] === windowsLatest[key]);
          include.push({ os: 'windows-2025', node: '24', cursor: windowsBaseline.version, release: 'baseline', channel: sameWindows ? 'baseline+latest' : 'baseline' });
          if (!sameWindows) include.push({ os: 'windows-2025', node: '24', cursor: windowsLatest.version, release: 'latest', channel: 'latest' });
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Cursor App baseline: **${baseline.version}**; desktop latest frozen for this run: **${latest.version}**.\n\n` +
            `${include.length} required Linux, macOS and Windows App jobs, including Linux baseline on Node 22. No version fallback.\n`);
          NODE
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance'
        with:
          name: cursor-app-releases-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-app-releases.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify test assertions reject malformed content and unexpected failures
        run: node --test scripts/ci/shared/ci-evidence.test.mjs scripts/ci/shared/native-evidence-workflow.test.mjs scripts/ci/shared/native-evidence-wrappers.test.mjs scripts/ci/shared/native-process-cleanup.test.mjs scripts/ci/shared/release-acceptance.test.mjs scripts/ci/shared/preview-upgrade-baseline.test.mjs scripts/ci/codex/codex-native-content-check.test.mjs scripts/ci/codex/codex-lifecycle-assertions.test.mjs scripts/ci/codex/codex-install-interruption-evidence.test.mjs scripts/ci/codex/codex-install-interruption-check.test.mjs scripts/ci/codex/codex-setup-pty.test.mjs scripts/ci/codex/codex-setup-pty-consumers.test.mjs scripts/ci/codex/codex-install-smoke.test.mjs scripts/ci/claude/claude-install-evidence.test.mjs scripts/ci/claude/claude-install-smoke.test.mjs scripts/ci/codex/codex-writeback-diagnostics.test.mjs scripts/ci/opencode/opencode-native-support.test.mjs scripts/ci/opencode/opencode-initialization-diagnostic.test.mjs scripts/ci/opencode/opencode-initialization-layouts.test.mjs scripts/ci/claude/claude-native-content-check.test.mjs scripts/ci/claude/claude-native-support.test.mjs scripts/ci/claude/claude-permissions-support.test.mjs scripts/ci/claude/claude-lifecycle-assertions.test.mjs scripts/ci/claude/claude-lifecycle-process.test.mjs scripts/ci/claude/claude-background-assertions.test.mjs scripts/ci/claude/claude-install-interruption-driver.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-native-content-check.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-native-support.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-install-cleanup.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-lifecycle-assertions.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-install-interruption-driver.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-permissions-support.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-background-assertions.test.mjs
      - name: Verify shared CodeBuddy and WorkBuddy native and install contracts
        run: node --test scripts/ci/codebuddy-workbuddy/codebuddy-native-memory-support.test.mjs scripts/ci/codebuddy-workbuddy/codebuddy-install-interruption-check.test.mjs scripts/ci/codebuddy-workbuddy/workbuddy-install-entry.test.mjs
      - name: Verify Cursor App canary contracts
        run: node --test scripts/ci/cursor/cursor-app-*.test.mjs scripts/ci/cursor/cursor-lifecycle-*.test.mjs
      - name: Build and validate the installable package
        id: package-check
        shell: bash
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/user" "$test_root/tmp"
          package_status=0
          env -i PATH="$PATH" HOME="$test_root/user" \
            MEMORAX_CODE_HOME="$test_root/state" \
            npm_config_cache="$test_root/npm-cache" TMPDIR="$test_root/tmp" \
            make npm-package-check || package_status=$?
          if [[ -f dist/npm/check-result.json ]]; then
            node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('dist/npm/check-result.json', 'utf8'));
          if (result.artifactChecks !== 'PASS') throw new Error('Artifact validation did not complete');
          appendFileSync(process.env.GITHUB_OUTPUT, 'artifact-ready=true\n');
          NODE
          fi
          exit "$package_status"
      - name: Record artifact checksum
        id: package-provenance
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        shell: bash
        run: |
          sha256sum dist/npm/tarballs/*.tgz
          # Publish the checksum only when one candidate is unambiguous; this step adds no new gate.
          set -- dist/npm/tarballs/memorax-memorax-code-preview-*.tgz
          if [[ "$#" -eq 1 && -f "$1" && ! -L "$1" ]]; then
            printf 'sha256=%s\n' "$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: upload-package
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        with:
          name: memorax-code-package-attempt${{ github.run_attempt }}
          path: dist/npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Record the candidate package and frozen client versions
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          CODEX_MATRIX: ${{ steps.codex-versions.outputs.matrix }}
          OPENCODE_MATRIX: ${{ steps.opencode-versions.outputs.matrix }}
          CLAUDE_MATRIX: ${{ steps.claude-versions.outputs.matrix }}
          CODEBUDDY_MATRIX: ${{ steps.codebuddy-versions.outputs.matrix }}
          PACKAGE_ARTIFACT_ID: ${{ steps.upload-package.outputs.artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.upload-package.outputs.artifact-digest }}
        run: |
          cursor_releases=()
          if [[ -f "$RUNNER_TEMP/cursor-app-releases.json" ]]; then
            cursor_releases=(--cursor-releases "$RUNNER_TEMP/cursor-app-releases.json" --cursor-releases-artifact-name "cursor-app-releases-attempt$GITHUB_RUN_ATTEMPT")
          fi
          node scripts/ci/shared/ci-evidence.mjs manifest "$RUNNER_TEMP/native-client-inputs.json" \
            --package-dir dist/npm/tarballs --package-artifact-name "memorax-code-package-attempt$GITHUB_RUN_ATTEMPT" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --matrix "codex=$CODEX_MATRIX" --matrix "opencode=$OPENCODE_MATRIX" \
            --matrix "claude=$CLAUDE_MATRIX" --matrix "codebuddy=$CODEBUDDY_MATRIX" "${cursor_releases[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.package-check.outputs.artifact-ready == 'true'
        continue-on-error: true
        with:
          name: native-client-inputs-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-client-inputs.json
          if-no-files-found: warn
          retention-days: 30

  install:
    name: Codex ${{ matrix.channel }} ${{ matrix.codex }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.codex-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Record native test inputs
        id: record-inputs
        continue-on-error: true
        shell: bash
        env:
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.codex }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
          PACKAGE_ARTIFACT_NAME: ${{ needs.package.outputs.package-artifact-name }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.package-artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.package.outputs.package-artifact-digest }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package-sha256 }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs inputs "$RUNNER_TEMP/native-evidence/inputs.json" \
            --client codex --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" \
            --matrix-os "$MATRIX_OS" --matrix-node "$MATRIX_NODE" --npm-version "$(npm -v)" \
            --package-dir dist/npm/tarballs --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --expected-package-sha256 "$PACKAGE_SHA256"
      - name: Verify lifecycle, native writeback, permissions and shared configuration (macOS/Linux)
        id: native-posix
        if: runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
        run: scripts/ci/codex/codex-install-check.sh dist/npm/tarballs "$CODEX_VERSION"
      - name: Verify Windows user PATH cleanup on success, failure and interruption
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/shared/codex-install-user-path.test.ps1
      - name: Verify lifecycle, native writeback, permissions and shared configuration (Windows)
        id: native-windows
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          CODEX_VERSION: ${{ matrix.codex }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
        run: ./scripts/ci/codex/codex-install-check.ps1 -TarballDirectory dist/npm/tarballs -CodexVersion $env:CODEX_VERSION
      - name: Summarize first-failure evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TEST_OUTCOME: ${{ runner.os == 'Windows' && steps.native-windows.outcome || steps.native-posix.outcome }}
          INPUTS_OUTCOME: ${{ steps.record-inputs.outcome }}
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.codex }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs summarize "$RUNNER_TEMP/native-evidence" --client codex --os "$MATRIX_OS" \
            --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" --node "$MATRIX_NODE" \
            --test-step-outcome "$TEST_OUTCOME" --inputs-step-outcome "$INPUTS_OUTCOME" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload-evidence
        if: always()
        continue-on-error: true
        with:
          name: native-evidence-codex-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report evidence export
        if: always()
        continue-on-error: true
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
          ARTIFACT_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
        run: node scripts/ci/shared/ci-evidence.mjs export-status --outcome "$UPLOAD_OUTCOME" --artifact-id "$ARTIFACT_ID" --github-summary "$GITHUB_STEP_SUMMARY"
      # A CI tool self-test, reported on its own summary line: it runs after the native suites and the
      # evidence export, so it can neither skip them nor delay their evidence. A skipped test fails it.
      - name: Verify evidence helpers keep the wrapper result (Windows)
        if: always() && !cancelled() && runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tap = Join-Path $env:RUNNER_TEMP 'evidence-wrapper-self-test.tap'
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap "--test-reporter-destination=$tap" scripts/ci/shared/native-evidence-wrappers.test.mjs
          node scripts/ci/shared/ci-evidence.mjs self-test-status --tap $tap --exit-code $LASTEXITCODE --github-summary $env:GITHUB_STEP_SUMMARY

  opencode:
    name: OpenCode ${{ matrix.channel }} ${{ matrix.opencode }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.opencode-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.package-artifact-name }}
          path: dist/npm/tarballs
      - name: Record native test inputs
        id: record-inputs
        continue-on-error: true
        shell: bash
        env:
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.opencode }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
          PACKAGE_ARTIFACT_NAME: ${{ needs.package.outputs.package-artifact-name }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.package-artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.package.outputs.package-artifact-digest }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package-sha256 }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs inputs "$RUNNER_TEMP/native-evidence/inputs.json" \
            --client opencode --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" \
            --matrix-os "$MATRIX_OS" --matrix-node "$MATRIX_NODE" --npm-version "$(npm -v)" \
            --package-dir dist/npm/tarballs --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --expected-package-sha256 "$PACKAGE_SHA256"
      - name: Verify lifecycle, native memory, permissions and recovery (macOS/Linux)
        id: native-posix
        if: runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
        run: bash scripts/ci/opencode/opencode-install-check.sh dist/npm/tarballs "$OPENCODE_VERSION"
      - name: Verify shared Windows user PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/shared/codex-install-user-path.test.ps1
      - name: Verify lifecycle, native memory, permissions and recovery (Windows)
        id: native-windows
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          MEMORAX_CI_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence/suites
        run: ./scripts/ci/opencode/opencode-install-check.ps1 -TarballDirectory dist/npm/tarballs -OpenCodeVersion $env:OPENCODE_VERSION
      - name: Summarize first-failure evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TEST_OUTCOME: ${{ runner.os == 'Windows' && steps.native-windows.outcome || steps.native-posix.outcome }}
          INPUTS_OUTCOME: ${{ steps.record-inputs.outcome }}
          CLIENT_CHANNEL: ${{ matrix.channel }}
          CLIENT_VERSION: ${{ matrix.opencode }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
        run: |
          node scripts/ci/shared/ci-evidence.mjs summarize "$RUNNER_TEMP/native-evidence" --client opencode --os "$MATRIX_OS" \
            --channel "$CLIENT_CHANNEL" --client-version "$CLIENT_VERSION" --node "$MATRIX_NODE" \
            --test-step-outcome "$TEST_OUTCOME" --inputs-step-outcome "$INPUTS_OUTCOME" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload-evidence
        if: always()
        continue-on-error: true
        with:
          name: native-evidence-opencode-${{ matrix.os }}-${{ matrix.channel }}-node-${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report evidence export
        if: always()
        continue-on-error: true
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
          ARTIFACT_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
        run: node scripts/ci/shared/ci-evidence.mjs export-status --outcome "$UPLOAD_OUTCOME" --artifact-id "$ARTIFACT_ID" --github-summary "$GITHUB_STEP_SUMMARY"
      # A CI tool self-test, reported on its own summary line: it runs after the native suites and the
      # evidence export, so it can neither skip them nor delay their evidence. A skipped test fails it.
      - name: Verify evidence helpers keep the wrapper result (Windows)
        if: always() && !cancelled() && runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tap = Join-Path $env:RUNNER_TEMP 'evidence-wrapper-self-test.tap'
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap "--test-reporter-destination=$tap" scripts/ci/shared/native-evidence-wrappers.test.mjs
          node scripts/ci/shared/ci-evidence.mjs self-test-status --tap $tap --exit-code $LASTEXITCODE --github-summary $env:GITHUB_STEP_SUMMARY

  claude:
    name: Claude smoke ${{ matrix.channel }} ${{ matrix.claude }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    if: always() && !cancelled() && needs.package.outputs.artifact-ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release-acceptance')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.claude-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
