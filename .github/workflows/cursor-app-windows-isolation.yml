name: Cursor App Windows loopback feasibility (not native acceptance)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-loopback-proof:
    name: Windows loopback feasibility (not native acceptance)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test Windows loopback proof contracts
        run: node --test scripts/cursor-app-windows-isolation-probe.test.mjs scripts/cursor-app-windows-isolation-workflow.test.mjs scripts/cursor-app-isolation-workflow.test.mjs
      - name: Run Windows loopback feasibility proof (not native acceptance)
        shell: pwsh
        run: |
          $reportDirectory = Join-Path $env:RUNNER_TEMP 'cursor-app-windows-isolation'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          & ./scripts/cursor-app-windows-isolation-check.ps1 -ReportPath (Join-Path $reportDirectory 'report.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload public Windows loopback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-app-windows-loopback-proof
          path: ${{ runner.temp }}/cursor-app-windows-isolation/report.json
          if-no-files-found: error
